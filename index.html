<title>Octant · Suivi de portefeuille</title>
<style>
  :root {
    --bg: #0F172A; --card: #16213A; --card2: #1E293B; --line: #7DD3FC;
    --text: #F1F5F9; --muted: #94A3B8; --accent: #38BDF8; --green: #34D399;
    --pos: #4ADE80; --neg: #FB7185; --danger: #F87171;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
    background: var(--bg); color: var(--text); padding-bottom: calc(112px + env(safe-area-inset-bottom));  /* 112px : le TOTAL et son filet bleu ne passent jamais derriere la nav du bas */
  }
  /* ---------- En-tete ---------- */
  header { padding: calc(18px + env(safe-area-inset-top)) 18px 10px; }
  .titre {
    font-size: clamp(19px, 6vw, 24px); font-weight: 800; letter-spacing: .2px;
    background: linear-gradient(90deg, #7DD3FC 0%, #34D399 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .signature { margin-top: 3px; font-size: 11px; font-style: italic; color: var(--green); opacity: .85; }
  .maj { margin-top: 4px; font-size: 10px; color: var(--muted); }
  .majrow { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; gap: 8px; }
  /* Bouton d'actualisation : pilule visible en degrade bleu-vert,
     icone qui tourne pendant la mise a jour (class .tourne) */
  .btnmaj {
    display: inline-flex; align-items: center; gap: 7px; flex: 0 0 auto;
    background: linear-gradient(135deg, #38BDF8, #34D399);
    color: #062033; font-weight: 800; font-size: 12px;
    padding: 9px 16px; border-radius: 999px; border: none; cursor: pointer; font-family: inherit;
    box-shadow: 0 3px 12px rgba(56,189,248,.4);
  }
  .btnmaj:active { transform: scale(.96); }
  .btnmaj:disabled { opacity: .8; }
  .btnmaj .icmaj { display: inline-block; font-size: 14px; line-height: 1; }
  .btnmaj.tourne .icmaj { animation: tourne .9s linear infinite; }
  @keyframes tourne { to { transform: rotate(360deg); } }
  /* ---------- Cartes KPI ---------- */
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 6px 18px 4px; }
  .kpi { background: var(--card2); border-radius: 14px; padding: 10px 12px 9px; }
  .kpi .lbl { font-size: 9px; font-weight: 700; letter-spacing: .8px; color: var(--muted); text-transform: uppercase; }
  .kpi .val { font-size: 19px; font-weight: 800; margin-top: 2px; white-space: nowrap; }
  .pos { color: var(--pos) !important; } .neg { color: var(--neg) !important; }  /* vert / rouge : priorite sur le gris des lignes */
  /* ---------- Sections ---------- */
  main { padding: 12px 0 24px; }
  h2 { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; padding: 14px 18px 8px; }
  .groupe { margin: 0 14px 12px; background: var(--card); border-radius: 16px; overflow: hidden; }
  .groupe .ghead {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 10px 14px 8px; font-weight: 700; font-size: 13px; color: var(--line);
  }
  .groupe .gsub { font-size: 11px; color: var(--muted); font-weight: 500; }
  .ligne { padding: 9px 14px; border-top: 1px solid rgba(148,163,184,.12); cursor: pointer; }
  .ligne:active { background: rgba(56,189,248,.08); }
  .ligne .l1 { display: flex; justify-content: space-between; align-items: baseline; }
  .ligne .nom { font-size: 14px; font-weight: 600; }
  .ligne .meta { font-size: 10px; color: var(--muted); margin-top: 1px; }
  .ligne .montant { font-size: 14px; font-weight: 700; }
  .ligne .l2 { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
  .ligne .pct { font-size: 10px; color: var(--muted); white-space: nowrap; }
  .barre { height: 4px; border-radius: 2px; background: rgba(148,163,184,.18); flex: 1; margin: 0 10px; overflow: hidden; }
  .barre > div { height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--accent), var(--line)); }
  .stotal {
    display: flex; justify-content: space-between; padding: 9px 14px;
    border-top: 1px solid rgba(148,163,184,.18); font-size: 12px; font-weight: 700;
    background: rgba(30,41,59,.55);
  }
  .total {
    margin: 0 14px; display: flex; justify-content: space-between; align-items: baseline;
    padding: 12px 16px; border-radius: 14px; background: var(--card2);
    border-top: 2px solid var(--line); border-bottom: 2px solid var(--line); font-weight: 800;
  }
  .total .tval { font-size: 18px; }
  /* ---------- Boutons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: none; border-radius: 12px; padding: 11px 16px; font-size: 13px; font-weight: 700;
    background: var(--accent); color: #062033; cursor: pointer; font-family: inherit;
  }
  .btn:active { opacity: .85; }
  .btn.ghost { background: var(--card2); color: var(--text); }
  .btn.danger { background: rgba(248,113,113,.15); color: var(--danger); }
  .btn.wide { width: 100%; }
  .actions { display: flex; flex-direction: column; gap: 10px; padding: 4px 18px; }
  /* ---------- Nav du bas ---------- */
  nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    display: flex; padding-bottom: env(safe-area-inset-bottom);
    background: rgba(15,23,42,.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid rgba(148,163,184,.15);
  }
  nav button {
    flex: 1; padding: 10px 0 8px; background: none; border: none; cursor: pointer;
    color: var(--muted); font-family: inherit; font-size: 10px; font-weight: 600;
  }
  nav button .ic { display: block; font-size: 20px; margin-bottom: 2px; }
  nav button.actif { color: var(--accent); }
  /* ---------- Graphiques ---------- */
  .chartcard { background: var(--card); border-radius: 16px; margin: 0 14px 14px; padding: 14px; }
  .chartcard h3 { font-size: 13px; color: var(--green); margin-bottom: 10px; }
  .donutflex { display: flex; align-items: center; gap: 14px; }
  .legende { flex: 1; font-size: 11px; line-height: 1.9; }
  .legende .dot { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; }
  .legende .p { float: right; color: var(--muted); }
  .centre { font-size: 11px; fill: var(--muted); }
  .centre .v { font-size: 15px; font-weight: 800; fill: var(--text); }
  .vide { text-align: center; color: var(--muted); font-size: 12px; padding: 18px; line-height: 1.7; }
  .vide b { color: var(--text); }
  /* ---------- Modal ---------- */
  .voile {
    position: fixed; inset: 0; z-index: 60; background: rgba(4,10,22,.66);
    display: none; align-items: flex-end; justify-content: center;
  }
  .voile.ouvert { display: flex; }
  .feuille {
    width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto;
    background: var(--card); border-radius: 22px 22px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
  }
  .feuille h3 { color: var(--green); font-size: 15px; margin-bottom: 12px; }
  label { display: block; font-size: 10px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); margin: 10px 0 4px; }
  input, select {
    width: 100%; padding: 11px 12px; border-radius: 11px; border: 1px solid rgba(148,163,184,.25);
    background: var(--bg); color: var(--text); font-size: 14px; font-family: inherit;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .deux { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .factions { display: flex; gap: 10px; margin-top: 16px; }
  .factions .btn { flex: 1; }
  /* ---------- Reglages ---------- */
  .reglage { background: var(--card); border-radius: 16px; margin: 0 14px 14px; padding: 14px; }
  .reglage p { font-size: 11px; color: var(--muted); line-height: 1.6; margin-bottom: 8px; }
  .reglage code { background: rgba(56,189,248,.12); color: var(--line); padding: 1px 5px; border-radius: 5px; font-size: 10px; }
  /* ---------- Toast ---------- */
  #toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom));
    background: var(--card2); color: var(--text); border: 1px solid rgba(125,211,252,.3);
    padding: 10px 16px; border-radius: 12px; font-size: 12px; z-index: 80; max-width: 88%;
    text-align: center; transition: opacity .3s; opacity: 0; pointer-events: none;
  }
  #toast.vu { opacity: 1; }
</style>

<script>
'use strict';
/* =====================================================================
   Octant · Suivi de portefeuille — PWA autonome, sans connexion bancaire.
   Toutes les donnees restent dans le stockage local de ce telephone
   (localStorage). Export / import JSON : tes donnees t'appartiennent.

   HEBERGEMENT (Netlify connecte a GitHub — cours automatiques sans clé API) :
   1. Deposer les fichiers dans le dépôt GitHub 'octant' :
         index.html                    <- ce fichier (a la racine)
         (le logo est deja integre dans index.html — aucun fichier image a ajouter)
         package.json                  <- { 'engines': { 'node': '>=18' } }
         netlify/functions/cours.js    <- fichier fourni a part (v3 : identite + ISIN)
         sw.js                         <- code ci-dessous (optionnel : hors ligne Android)
   2. Sur Netlify : Add new project > importer depuis GitHub, tout par defaut.
      Mise a jour ulterieure : modifier les fichiers sur GitHub ; Netlify
      redéploie tout seul en quelques secondes.
   3. Installer : 'Ajouter a l'ecran d'accueil' (iPhone : tel quel ; Android :
      avec sw.js).
   La fonction cours.js interroge Yahoo Finance (comme la version Sheets),
   couvre Euronext (CW8, AIR.PA, IWDA.AS...), convertit en euros et sert
   les cours a l'app. Aucune clé API, rien a configurer pour l'acheteur.

      // netlify/functions/cours.js : FICHIER FOURNI A PART (version 3).
      // v3 - sécurite des cours : 
      //   - verification d'identite : le nom du titre renvoye par Yahoo doit
      //     correspondre au nom de l'actif saisi (evite les faux cours AL, WLB, BI) ;
      //   - support des ISIN (ex FR0000121014) : code unique, aucune confusion ;
      //   - exceptions mnémoniques : AL->AI.PA, FP->TTE.PA, WLB->WLN.PA, BI->BIM.PA ;
      //   - réponse JSON avec champ 'detail' par actif : ticker, nom, confiance
      //     (verifie / pa / douteux) -> l'app affiche un bandeau si douteux.

      // sw.js (optionnel : hors ligne + installation Android complete)
      const C = 'octant-v1';
      self.addEventListener('install', e => self.skipWaiting());
      self.addEventListener('fetch', e => {
        if (e.request.url.indexOf('/.netlify/functions/') !== -1) {   // cours : réseau d'abord
          e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
          return;
        }
        e.respondWith(
          caches.open(C).then(c => c.match(e.request).then(r => {
            const f = fetch(e.request).then(res => {
              if (res.ok) c.put(e.request, res.clone());
              return res;
            }).catch(() => r);
            return r || f;
          }))
        );
      });
      self.addEventListener('activate', e => e.waitUntil(
        caches.keys().then(ks => Promise.all(ks.filter(k => k !== C).map(k => caches.delete(k))))
      ));

   Sur iPhone, l'installation fonctionne des maintenant sans sw.js.
   ===================================================================== */

var PALETTE = ['#38BDF8','#A78BFA','#F472B6','#34D399','#FBBF24','#22D3EE','#FB923C','#C084FC','#4ADE80','#F87171'];
var CLE = 'octant';
var etat = charger();

/* ---------- Stockage local ---------- */
function charger() {
  try { return JSON.parse(localStorage.getItem(CLE)) || vide(); } catch (e) { return vide(); }
  function vide() { return { actifs: [], historique: [], cleApi: '', derniereMajIso: '' }; }
}
function sauver() { localStorage.setItem(CLE, JSON.stringify(etat)); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

/* ---------- Formatage ---------- */
function eur(v) { return new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(v || 0); }
function eur2(v) { return new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' }).format(v || 0); }
function pct(v) { return (v >= 0 ? '+' : '') + (v * 100).toFixed(2).replace('.', ',') + ' %'; }
function dateFR(iso) { var t = iso.split('-'); return t[2] + '/' + t[1] + '/' + t[0]; }

/* ---------- Secteurs & zones : reconnaissance automatique ---------- */
/* Profils intégrés des ETF les plus courants (répartitions indicatives,
   stables à quelques points par an) : les débutants n'ont rien à saisir.
   Un champ accepte un libellé simple (« Tech ») ou pondéré (« Tech 60; Santé 40 »). */
var PROFILES_ETF = [
  { m: ['ACWI', 'ALL COUNTRY', 'DCAM'], sec: 'Technologie 32; Financier 16; Santé 12; Industrie 10; Consommation 11; Autres 19', zone: 'USA 63; Europe 15; Asie-Pacifique 15; Autres 7' },
  { m: ['WORLD'], sec: 'Technologie 32; Financier 16; Santé 13; Industrie 11; Consommation 10; Autres 18', zone: 'USA 70; Europe 15; Asie-Pacifique 15' },
  { m: ['S&P', '500', 'US EQUITY', 'ETATS-UNIS'], sec: 'Technologie 33; Financier 17; Santé 12; Industrie 9; Consommation 21; Autres 8', zone: 'USA 100' },
  { m: ['NASDAQ'], sec: 'Technologie 60; Communication 15; Consommation 12; Santé 8; Autres 5', zone: 'USA 100' },
  { m: ['EUROPE', 'STOXX', '600'], sec: 'Financier 20; Industrie 17; Santé 16; Consommation 13; Technologie 12; Autres 22', zone: 'Europe 100' },
  { m: ['EMERGING', 'EM IMI', 'PAEEM'], sec: 'Technologie 28; Financier 22; Consommation 12; Industrie 10; Autres 28', zone: 'Asie-Pacifique 75; Amérique latine 10; Europe 10; Autres 5' },
  { m: ['JAPON', 'JAPAN', 'NIPPON'], sec: 'Technologie 25; Industrie 20; Consommation 12; Financier 12; Autres 31', zone: 'Japon 100' },
  { m: ['GOLD', 'OR PHYSIQUE', 'XAU'], sec: 'Or 100', zone: 'Monde 100' },
  { m: ['IMMO', 'SCPI', 'REIT'], sec: 'Immobilier 100', zone: 'Monde 100' }
];
var TICKERS_ETF = {
  'DCAM': 0, 'PAEEM': 5, 'ETZ': 4, 'EMIM': 5,
  'CW8': 1, 'SWSH': 1, 'IWDA': 1, 'SWDA': 1,   // ETF « World »
  'SXR8': 2,                                    // S&P 500
  'GOLD': 7                                     // ETF or
};
function profilETF(nom, code) {
  var base = String(code || '').toUpperCase().split('.')[0];
  if (TICKERS_ETF[base] !== undefined) return PROFILES_ETF[TICKERS_ETF[base]];
  var hay = (String(nom || '') + ' ' + String(code || '')).toUpperCase();
  for (var i = 0; i < PROFILES_ETF.length; i++) {
    for (var j = 0; j < PROFILES_ETF[i].m.length; j++) {
      if (hay.indexOf(PROFILES_ETF[i].m[j]) !== -1) return PROFILES_ETF[i];
    }
  }
  return null;
}
function parseEtiquettes(txt) {
  var parts = String(txt || '').split(';'), out = [], tot = 0;
  parts.forEach(function (p) {
    p = p.trim(); if (!p) return;
    var m = p.match(/^(.+?)[\s]+([\d.,]+)$/);
    var o = m ? { label: m[1].trim(), poids: parseFloat(m[2].replace(',', '.')) || 1 }
              : { label: p, poids: 1 };
    out.push(o); tot += o.poids;
  });
  out.forEach(function (o) { o.part = tot ? o.poids / tot : 0; });
  return out;
}
function zoneDepuisSuffixe(c) {
  var s = String(c || '').toUpperCase();
  if (s.indexOf('.') === -1) return '';
  var suf = s.substring(s.indexOf('.'));
  if (suf === '.PA' || suf === '.NX') return 'France';
  if (suf === '.AS') return 'Pays-Bas';
  if (suf === '.L') return 'Royaume-Uni';
  if (suf === '.DE' || suf === '.F' || suf === '.SG' || suf === '.BE') return 'Allemagne';
  if (suf === '.MI') return 'Italie';
  if (suf === '.MC') return 'Espagne';
  if (suf === '.BR') return 'Belgique';
  if (suf === '.SW') return 'Suisse';
  if (suf === '.TO' || suf === '.V') return 'Canada';
  if (suf === '.AX' || suf === '.NZ' || suf === '.HK' || suf === '.T' ||
      suf === '.SS' || suf === '.SZ' || suf === '.KS' || suf === '.KQ') return 'Asie-Pacifique';
  return 'Monde';
}
/* Suggestion hors ligne pour un actif : profil ETF, puis heuristiques
   (cash, livret, fonds en euros), puis zone déduite du suffixe du code. */
function suggestion(nom, code) {
  var p = profilETF(nom, code);
  if (p) return { sec: p.sec, zone: p.zone, via: 'ETF reconnu : répartition intégrée' };
  var nu = String(nom || '').toUpperCase();
  if (!code) {
    if (nu.indexOf('LIVRET') !== -1 || nu.indexOf('CASH') !== -1 ||
        nu.indexOf('ESPÈCES') !== -1 || nu.indexOf('ESPECES') !== -1)
      return { sec: 'Cash', zone: 'Cash', via: 'Cash : exclu des camemberts' };
    if (nu.indexOf('FONDS') !== -1 || nu.indexOf('EURO') !== -1)
      return { sec: 'Obligations', zone: 'France', via: 'Fonds en euros' };
    return null;
  }
  var z = zoneDepuisSuffixe(code);
  if (z) return { sec: '', zone: z, via: 'Zone déduite du code' };
  return null;
}

/* ---------- Calculs ---------- */
function montants(a) { return { inv: (a.qte || 0) * (a.pru || 0), val: (a.qte || 0) * (a.cours || 0) }; }
function totaux() {
  var inv = 0, val = 0;
  etat.actifs.forEach(function (a) { var m = montants(a); inv += m.inv; val += m.val; });
  return { inv: inv, val: val, pv: val - inv, pvp: inv ? (val - inv) / inv : 0 };
}
function groupes() {
  var g = {};
  etat.actifs.forEach(function (a) {
    var s = (a.support || 'Autre').trim() || 'Autre';
    (g[s] = g[s] || []).push(a);
  });
  return Object.keys(g).sort(function (x, y) {
    var vx = 0, vy = 0;
    g[x].forEach(function (a) { vx += montants(a).val; });
    g[y].forEach(function (a) { vy += montants(a).val; });
    return vy - vx;
  }).map(function (s) { return { nom: s, actifs: g[s] }; });
}
function repartition(champ) {
  var m = {}, ordre = [];
  etat.actifs.forEach(function (a) {
    var lib = ((champ === 'secteur' ? a.secteur : a.zone) || '').trim();
    if (!lib) return;
    if (lib.toUpperCase() === 'CASH') return;              // le cash n'est pas une exposition
    var mnt = montants(a).val;
    parseEtiquettes(lib).forEach(function (p) {             // « Tech 60; Santé 40 » ou « Tech »
      m[p.label] = (m[p.label] || 0) + mnt * p.part;
      if (ordre.indexOf(p.label) === -1) ordre.push(p.label);
    });
  });
  return ordre.map(function (l) { return { label: l, val: m[l] }; }).sort(function (x, y) { return y.val - x.val; });
}

/* ---------- Composants SVG ---------- */
function donut(items) {
  var total = 0; items.forEach(function (i) { total += i.val; });
  if (!total) return '<div class="vide">Aucune donnée.<br>« ' + (items.champ || 'Secteur') + ' » se remplit automatiquement :<br>profils ETF reconnus depuis le nom ou le code,<br>ou bouton 🪄 dans l\'onglet Analyse.</div>';
  var C = 2 * Math.PI * 40, off = 0, segs = '';
  items.forEach(function (i, k) {
    var len = i.val / total * C;
    segs += '<circle r="40" cx="60" cy="60" fill="none" stroke="' + PALETTE[k % PALETTE.length] +
      '" stroke-width="18" stroke-dasharray="' + len + ' ' + (C - len) + '" stroke-dashoffset="' + (-off) +
      '" transform="rotate(-90 60 60)"/>';
    off += len;
  });
  var centre = '<text x="60" y="56" text-anchor="middle" class="centre">Total</text>' +
    '<text x="60" y="74" text-anchor="middle" class="centre v">' + eur(total) + '</text>';
  var leg = items.map(function (i, k) {
    return '<div><span class="dot" style="background:' + PALETTE[k % PALETTE.length] + '"></span>' +
      i.label + '<span class="p">' + Math.round(i.val / total * 100) + '&thinsp;%</span></div>';
  }).join('');
  return '<div class="donutflex"><svg width="120" height="120" viewBox="0 0 120 120">' + segs + centre +
    '</svg><div class="legende">' + leg + '</div></div>';
}
function courbe() {
  var h = etat.historique;
  if (h.length < 1) return '<div class="vide">Aucun point encore.<br>Utilise « Enregistrer un point » juste au-dessus<br>pour démarrer la courbe de ton patrimoine.</div>';
  var W = 320, H = 140, P = 8;
  var vs = h.map(function (p) { return p.valeur; });
  var min = Math.min.apply(null, vs), max = Math.max.apply(null, vs);
  if (max === min) { max += 1; min -= 1; }
  var X = function (i) { return h.length === 1 ? W / 2 : P + i * (W - 2 * P) / (h.length - 1); };
  var Y = function (v) { return H - P - (v - min) / (max - min) * (H - 2 * P); };
  var pts = h.map(function (p, i) { return X(i).toFixed(1) + ',' + Y(p.valeur).toFixed(1); }).join(' ');
  var aires = P + ',' + (H - P) + ' ' + pts + ' ' + (h.length === 1 ? W / 2 : W - P) + ',' + (H - P);
  var dots = h.map(function (p, i) {
    return '<circle cx="' + X(i) + '" cy="' + Y(p.valeur) + '" r="3.5" fill="#7DD3FC"/>';
  }).join('');
  return '<svg width="100%" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="display:block">' +
    '<polygon points="' + aires + '" fill="rgba(56,189,248,.13)"/>' +
    '<polyline points="' + pts + '" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linejoin="round"/>' +
    dots +
    '<text x="' + P + '" y="12" font-size="9" fill="#94A3B8">' + eur(max) + '</text>' +
    '<text x="' + P + '" y="' + (H - 2) + '" font-size="9" fill="#94A3B8">' + eur(min) + '</text>' +
    '</svg><div style="display:flex;justify-content:space-between;font-size:9px;color:var(--muted)">' +
    '<span>' + dateFR(h[0].date) + '</span><span>' + dateFR(h[h.length - 1].date) + '</span></div>';
}

/* Remplissage automatique de Secteur et Zone pendant la saisie :

function autoEtiquettes() {
  var fs = document.getElementById('f_secteur'), fz = document.getElementById('f_zone');

  if (!fs || !fz) return;
  var s = suggestion(document.getElementById('f_nom').value.trim(), document.getElementById('f_code').value.trim());
  var poser = function (el, v) {

/* ---------- Mise a jour des cours : quotidienne automatique + bouton ---------- */
/* Appelée automatiquement à l'ouverture de l'app (une fois par jour) et via
   le bouton 🔄. Source principale : la fonction Netlify cours.js (proxy Yahoo
   Finance, couvre Euronext, convertit en euros, aucune clé). Repli si
   l'app est hébergée sans la fonction : Twelve Data (titres US, clé perso). */
function majCours(auto) {
  var cibles = etat.actifs.filter(function (a) { return a.code; });
  if (!cibles.length) { if (!auto) toast('Aucun actif avec un code de cotation.'); return; }
  var bm = document.getElementById('btnmaj'), bl = document.getElementById('btnmajlbl');
  if (bm) { bm.disabled = true; bm.classList.add('tourne'); }
  if (bl) bl.textContent = 'Actualisation…';
  if (!auto) toast('⏳ Actualisation de ' + cibles.length + ' cours...');
  var codes = cibles.map(function (a) { return a.code; }).join(',');
  var noms = cibles.map(function (a) { return (a.nom || '').replace(/[|,]/g, ' '); }).join('|');
  fetch('/.netlify/functions/cours?codes=' + encodeURIComponent(codes) + '&noms=' + encodeURIComponent(noms))
    .then(function (r) { if (!r.ok) throw new Error('fonction'); return r.json(); })
    .then(function (d) {
      var ok = 0, echecs = (d && d.echecs) || [], alertes = [];
      cibles.forEach(function (a) {
        var p = d && d.resultat && (d.resultat[String(a.code).toUpperCase()] || d.resultat[a.code]);
        if (p) { a.cours = p; ok++; }
        else if (echecs.indexOf(a.code) === -1) echecs.push(a.code);
      });
      var det = (d && d.detail) || {};
      cibles.forEach(function (a) {
        var info = det[String(a.code).toUpperCase()];
        if (info && info.confiance === 'douteux') alertes.push(a.nom + ' : trouvé « ' + (info.nom || info.ticker) + ' » — vérifie le code (l\'ISIN marche aussi)');
        else if (a.pru && a.cours && (a.cours / a.pru > 20 || a.cours / a.pru < 0.05)) alertes.push(a.nom + ' : cours très éloigné du PRU — vérifie le code ou le PRU');
      });
      finMaj(auto, ok, echecs, alertes);
    })
    .catch(function () {
      if (etat.cleApi) majCoursTwelveData(auto, cibles);
      else finMaj(auto, 0, cibles.map(function (a) { return a.code; }));
    });
}
function finMaj(auto, ok, echecs, alertes) {
  var bm = document.getElementById('btnmaj'), bl = document.getElementById('btnmajlbl');
  if (bm) { bm.disabled = false; bm.classList.remove('tourne'); }
  if (bl) bl.textContent = 'Actualiser les cours';
  if (ok) {
    etat.derniereMaj = new Date().toLocaleDateString('fr-FR');
    etat.derniereMajIso = new Date().toISOString().slice(0, 10);
  }
  sauver(); rendre(onglet);
  var msg;
  if (ok) msg = (auto ? '🔄 Cours actualisés automatiquement (' + ok + ')'
    : ok + ' cours actualisés' + (echecs.length ? ' — échecs : ' + echecs.join(', ') : ' ✓'));
  else msg = 'Échec de l\'actualisation — héberge l\'app avec la fonction cours.js (mode d\'emploi en tête de fichier) ou ajoute une clé Twelve Data dans Réglages.';
  if (alertes && alertes.length) msg += '  ⚠️ À vérifier : ' + alertes.join(' · ');
  toast(msg);
}
/* Repli Twelve Data : un appel par titre (limite gratuite 8/minute). */
function majCoursTwelveData(auto, cibles) {
  var ok = 0, echecs = [];
  (function suivant(i) {
    if (i >= cibles.length) { finMaj(auto, ok, echecs); return; }
    var a = cibles[i];
    fetch('https://api.twelvedata.com/price?symbol=' + encodeURIComponent(a.code) + '&apikey=' + etat.cleApi)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.price) { a.cours = parseFloat(d.price); ok++; }
        else echecs.push(a.code);
      })
      .catch(function () { echecs.push(a.code); })
      .then(function () {
        var delai = ((i + 1) % 8 === 0 && i + 1 < cibles.length) ? 61000 : 250;
        if (delai > 250 && !auto) toast('⏳ Limite gratuite (8/min) — reprise dans 1 min…');
        setTimeout(function () { suivant(i + 1); }, delai);
      });
  })(0);
}

    sauver(); rendre(onglet);
    var restes = etat.actifs.filter(function (a) { return !a.secteur || !a.zone; }).map(function (a) { return a.nom; });
    var msg = '🪄 ' + (cibles.length - restes.length) + ' actif(s) complété(s) automatiquement';
    if (restes.length) msg += ' — secteur/zone à saisir à la main : ' + restes.slice(0, 4).join(', ') + (restes.length > 4 ? '…' : '');
    toast(msg);
  };
  if (!viaApi.length) { finir(); return; }
  toast('⏳ Recherche du pays pour ' + viaApi.length + ' code(s)...');
  (function suivant(i) {
    if (i >= viaApi.length) { finir(); return; }
    var a = viaApi[i];
    fetch('https://api.twelvedata.com/stocks?symbol=' + encodeURIComponent(a.code) + '&apikey=' + etat.cleApi)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var pays = d && d.data && d.data[0] && d.data[0].country;
        if (pays && !a.zone) a.zone = TRAD_PAYS[pays] || pays;
      })
      .catch(function () {})
      .then(function () { setTimeout(function () { suivant(i + 1); }, 250); });  // respecte la limite gratuite
  })(0);
}

/* ---------- Export / import ---------- */
function exporter() {
  var blob = new Blob([JSON.stringify(etat, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'octant-portefeuille.json';
  a.click(); URL.revokeObjectURL(a.href);
  toast('⬇️ Export téléchargé');
}
function importer(input) {
  var f = input.files[0]; if (!f) return;
  var fr = new FileReader();
  fr.onload = function () {
    try {
      var d = JSON.parse(fr.result);
      if (!d.actifs) throw new Error('format');
      etat = d; sauver(); rendre(onglet); toast('⬆️ Données importées ✓');
    } catch (e) { toast('Fichier invalide.'); }
  };
  fr.readAsText(f);
}

/* ---------- Navigation ---------- */
var onglet = 'pf';
document.querySelectorAll('nav button').forEach(function (b) {
  b.addEventListener('click', function () {
    onglet = b.dataset.tab;
    document.querySelectorAll('nav button').forEach(function (x) { x.classList.toggle('actif', x === b); });
    rendre(onglet);
  });
});
/* Service worker : actif uniquement une fois le fichier heberge (cf. en-tete du script) */
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
rendre(onglet);
/* Actualisation quotidienne automatique : une fois par jour, à l'ouverture
   de l'app — le seul moment où une PWA sans serveur peut agir. Silencieuse :
   le bandeau d'en-tête affiche le résultat, la signature reste vraie. */
if (etat.derniereMajIso !== new Date().toISOString().slice(0, 10) &&
    etat.actifs.some(function (a) { return a.code; })) majCours(true);
</script>
